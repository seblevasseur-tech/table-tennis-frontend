<div class="admin-container">
    <div class="error-message" *ngIf="error">
        {{ error }}
    </div>

    <form class="add-card" (ngSubmit)="addPlayer()">
        <div class="avatar-upload-top">
            <label class="avatar-picker" title="Choisir une photo">
                <img [src]="imagePlayerPreviewUrl || 'assets/default-player-avatar.jpg'" alt="Aperçu avatar" />
                <div class="avatar-overlay">📷</div>
                <input type="file" accept="image/*" (change)="onFileSelected($event)" hidden />
            </label>
            <span class="avatar-hint">Cliquez pour ajouter une photo</span>
        </div>

        <div class="card-inputs">
            <div class="input-group">
                <label>Nom</label>
                <input type="text" name="name" placeholder="ex: Harimoto" [(ngModel)]="createPlayerCommand.name" required />
            </div>

            <div class="input-group">
                <label>Prénom</label>
                <input type="text" name="forname" placeholder="ex: Tomokazu" [(ngModel)]="createPlayerCommand.forname" required />
            </div>

            <div class="input-group">
                <label>Rang WTT</label>
                <input type="number" name="rating" placeholder="ex: 4" [(ngModel)]="createPlayerCommand.rating" required />
            </div>
        </div>

        <button type="submit" class="btn-spotify" [disabled]="isSubmitting">
            {{ isSubmitting ? 'Enregistrement...' : 'Ajouter le joueur' }}
        </button>
    </form>

    <hr>

        <div class="card-inputs">

                <input type="text" name="name" placeholder="ex: Butterfly" [(ngModel)]="createBladeCommand.brand" required />
            </div>

            <div class="input-group">
                <label>Nom</label>
                <input type="text" name="forname" placeholder="ex: Franziska ZLC" [(ngModel)]="createBladeCommand.name" required />

        </div>

        <button type="submit" class="btn-spotify" [disabled]="isSubmitting">

</div>
