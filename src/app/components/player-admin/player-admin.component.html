<div class="admin-container player-admin-page">
    <header class="form-header">
        <h1>Nouveau Joueur</h1>
        <p>Configurez le profil et la raquette du joueur</p>
    </header>

    <!-- Bannières d'information -->
    <div class="alert alert-error" *ngIf="error">
        <span class="alert-icon">⚠️</span>
        <span>{{ error }}</span>
    </div>

    <div class="alert alert-success" *ngIf="successMessage">
        <span class="alert-icon">✓</span>
        <span>{{ successMessage }}</span>
    </div>

    <form (ngSubmit)="addPlayer()" class="admin-form">
        <!-- SECTION 1 : PROFIL -->
        <section class="form-card">
            <h2 class="card-title">Informations Personnelles</h2>

            <!-- Upload Avatar -->
            <div class="avatar-upload-container">
                <label class="avatar-picker" [class.has-image]="imagePlayerPreviewUrl">
                    <img
                            [src]="imagePlayerPreviewUrl || 'assets/default-player-avatar.jpg'"
                            alt="Aperçu avatar"
                    />
                    <div class="avatar-overlay">
                        <span class="camera-icon">📸</span>
                        <span class="overlay-text">{{ imagePlayerPreviewUrl ? 'Changer' : 'Ajouter' }}</span>
                    </div>
                    <input
                        #fileInput
                        type="file"
                        accept="image/*"
                        (change)="onFileSelected($event)"
                        hidden
                    />
                </label>

                <button
                        type="button"
                        class="btn-remove-avatar"
                        *ngIf="imagePlayerPreviewUrl"
                        (click)="removeAvatar($event)"
                >
                    Supprimer la photo
                </button>
            </div>

            <!-- Nom & Prénom -->
            <div class="form-row">
                <div class="input-group">
                    <label for="forname">Prénom</label>
                    <input
                            id="forname"
                            type="text"
                            name="forname"
                            placeholder="Patrick"
                            [(ngModel)]="createPlayerCommand.forname"
                            required
                    />
                </div>

                <div class="input-group">
                    <label for="name">Nom</label>
                    <input
                            id="name"
                            type="text"
                            name="name"
                            placeholder="Franziska"
                            [(ngModel)]="createPlayerCommand.name"
                            required
                    />
                </div>
            </div>

            <!-- Main dominante (Segmented Switch UX) -->
            <div class="input-group">
                <label>Main dominante</label>
                <div class="segmented-control">
                    <button
                            type="button"
                            class="segmented-btn"
                            [class.active]="createPlayerCommand.handedness === 'RIGHT'"
                            (click)="setHandedness('RIGHT')"
                    >
                        <span>✋</span> Droitier
                    </button>
                    <button
                            type="button"
                            class="segmented-btn"
                            [class.active]="createPlayerCommand.handedness === 'LEFT'"
                            (click)="setHandedness('LEFT')"
                    >
                        <span>🤚</span> Gaucher
                    </button>
                </div>
            </div>
        </section>

        <!-- SECTION 2 : ÉQUIPEMENT -->
        <section class="form-card">
            <h2 class="card-title">Configuration de Raquette</h2>

            <!-- Bois -->
            <div class="input-group">
                <label>Bois (Blade)</label>
                <div class="equipment-dropdown">
                    <button
                            type="button"
                            class="equipment-dropdown-trigger"
                            [class.is-open]="isBladeDropdownOpen"
                            (click)="toggleBladeDropdown()"
                    >
                        <ng-container *ngIf="selectedBlade as blade; else bladePlaceholder">
                            <img [src]="blade.avatar || 'assets/default-blade-avatar.png'" [alt]="blade.name" />
                            <div class="selected-info">
                                <span class="brand-badge">{{ blade.brand }}</span>
                                <span class="item-name">{{ blade.name }}</span>
                            </div>
                        </ng-container>
                        <ng-template #bladePlaceholder>
                            <span class="placeholder-text">Sélectionner un bois...</span>
                        </ng-template>
                        <span class="dropdown-chevron">▼</span>
                    </button>

                    <div class="equipment-dropdown-menu" *ngIf="isBladeDropdownOpen">
                        <div class="dropdown-search">
                            <input
                                    type="text"
                                    placeholder="Rechercher un bois..."
                                    [(ngModel)]="bladeSearchQuery"
                                    name="bladeSearch"
                                    (click)="$event.stopPropagation()"
                            />
                        </div>
                        <div class="dropdown-list">
                            <button
                                    type="button"
                                    class="equipment-option"
                                    *ngFor="let blade of filteredBlades"
                                    (click)="selectBlade(blade)"
                                    [class.selected]="blade.id === createPlayerCommand.bladeId"
                            >
                                <img [src]="blade.avatar || 'assets/default-blade-avatar.png'" [alt]="blade.name" />
                                <div class="option-details">
                                    <span class="option-brand">{{ blade.brand }}</span>
                                    <span class="option-name">{{ blade.name }}</span>
                                </div>
                            </button>
                            <span class="equipment-empty" *ngIf="filteredBlades.length === 0">
                Aucun résultat
              </span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Revêtement Coup Droit -->
            <div class="input-group">
                <label>Revêtement Coup Droit</label>
                <div class="equipment-dropdown">
                    <button
                            type="button"
                            class="equipment-dropdown-trigger"
                            [class.is-open]="rubberDropdownOpen === 'forehand'"
                            (click)="toggleRubberDropdown('forehand')"
                    >
                        <ng-container *ngIf="selectedForehandRubber as rubber; else forehandPlaceholder">
                            <img [src]="rubber.avatar || 'assets/default-rubber-avatar.jpg'" [alt]="rubber.name" />
                            <div class="selected-info">
                                <span class="brand-badge">{{ rubber.brand }}</span>
                                <span class="item-name">{{ rubber.name }}</span>
                            </div>
                        </ng-container>
                        <ng-template #forehandPlaceholder>
                            <span class="placeholder-text">Sélectionner un revêtement...</span>
                        </ng-template>
                        <span class="dropdown-chevron">▼</span>
                    </button>

                    <div class="equipment-dropdown-menu" *ngIf="rubberDropdownOpen === 'forehand'">
                        <div class="dropdown-search">
                            <input
                                    type="text"
                                    placeholder="Rechercher..."
                                    [(ngModel)]="forehandSearchQuery"
                                    name="forehandSearch"
                                    (click)="$event.stopPropagation()"
                            />
                        </div>
                        <div class="dropdown-list">
                            <button
                                    type="button"
                                    class="equipment-option"
                                    *ngFor="let rubber of filteredForehandRubbers"
                                    (click)="selectRubber('forehand', rubber)"
                                    [class.selected]="rubber.id === createPlayerCommand.forehandRubberId"
                            >
                                <img [src]="rubber.avatar || 'assets/default-rubber-avatar.jpg'" [alt]="rubber.name" />
                                <div class="option-details">
                                    <span class="option-brand">{{ rubber.brand }}</span>
                                    <span class="option-name">{{ rubber.name }}</span>
                                </div>
                            </button>
                            <span class="equipment-empty" *ngIf="filteredForehandRubbers.length === 0">
                Aucun résultat
              </span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Revêtement Revers -->
            <div class="input-group">
                <label>Revêtement Revers</label>
                <div class="equipment-dropdown">
                    <button
                            type="button"
                            class="equipment-dropdown-trigger"
                            [class.is-open]="rubberDropdownOpen === 'backhand'"
                            (click)="toggleRubberDropdown('backhand')"
                    >
                        <ng-container *ngIf="selectedBackhandRubber as rubber; else backhandPlaceholder">
                            <img [src]="rubber.avatar || 'assets/default-rubber-avatar.jpg'" [alt]="rubber.name" />
                            <div class="selected-info">
                                <span class="brand-badge">{{ rubber.brand }}</span>
                                <span class="item-name">{{ rubber.name }}</span>
                            </div>
                        </ng-container>
                        <ng-template #backhandPlaceholder>
                            <span class="placeholder-text">Sélectionner un revêtement...</span>
                        </ng-template>
                        <span class="dropdown-chevron">▼</span>
                    </button>

                    <div class="equipment-dropdown-menu" *ngIf="rubberDropdownOpen === 'backhand'">
                        <div class="dropdown-search">
                            <input
                                    type="text"
                                    placeholder="Rechercher..."
                                    [(ngModel)]="backhandSearchQuery"
                                    name="backhandSearch"
                                    (click)="$event.stopPropagation()"
                            />
                        </div>
                        <div class="dropdown-list">
                            <button
                                    type="button"
                                    class="equipment-option"
                                    *ngFor="let rubber of filteredBackhandRubbers"
                                    (click)="selectRubber('backhand', rubber)"
                                    [class.selected]="rubber.id === createPlayerCommand.backhandRubberId"
                            >
                                <img [src]="rubber.avatar || 'assets/default-rubber-avatar.jpg'" [alt]="rubber.name" />
                                <div class="option-details">
                                    <span class="option-brand">{{ rubber.brand }}</span>
                                    <span class="option-name">{{ rubber.name }}</span>
                                </div>
                            </button>
                            <span class="equipment-empty" *ngIf="filteredBackhandRubbers.length === 0">
                Aucun résultat
              </span>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Bouton Soumettre -->
        <button type="submit" class="btn-spotify" [disabled]="isSubmitting || isLoading">
            <span *ngIf="isSubmitting" class="spinner"></span>
            <span>{{ isSubmitting ? 'Enregistrement en cours...' : 'Ajouter le joueur' }}</span>
        </button>
    </form>
</div>
