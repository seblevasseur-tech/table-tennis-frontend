<div class="catalog-list-page">
<div class="error-message" *ngIf="error">
    {{ error }}
</div>

<div class="catalog-search">
    <label for="rubber-search">Rechercher un revetement</label>
    <div class="catalog-search-control">
        <span class="catalog-search-icon" aria-hidden="true">&#128269;</span>
        <input id="rubber-search" type="search" [(ngModel)]="searchTerm" placeholder="Nom ou marque..." />
        <button type="button" class="catalog-search-clear" *ngIf="searchTerm" (click)="searchTerm = ''" aria-label="Effacer la recherche">x</button>
    </div>
</div>

<div class="rubbers-grid" *ngIf="filteredRubbers.length > 0; else noRubbers">
    <a class="rubber-card" *ngFor="let rubber of filteredRubbers" [routerLink]="['/rubbers', rubber.id]" [attr.aria-label]="'Voir le détail de ' + rubber.brand + ' ' + rubber.name">
        <div class="card-avatar">
            <img [src]="rubber.avatar || 'assets/default-rubber-avatar.png'" [alt]="rubber.name" />
        </div>

        <div class="card-info">
            <h3 class="rubber-brand">{{ rubber.brand }}</h3>
            <h3 class="rubber-name">{{ rubber.name }}</h3>
        </div>
    </a>
</div>

<ng-template #noRubbers>
    <p class="no-rubbers">{{ searchTerm ? "Aucun revetement ne correspond a cette recherche." : "Aucun revetement enregistre pour le moment." }}</p>
</ng-template>
</div>
