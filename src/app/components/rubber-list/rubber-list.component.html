<div class="catalog-list-page">
<div class="error-message" *ngIf="error">
    {{ error }}
</div>

<div class="rubbers-grid" *ngIf="rubbers.length > 0; else noRubbers">
    <div class="rubber-card" *ngFor="let rubber of rubbers">
        <div class="card-avatar">
            <img [src]="rubber.avatar || 'assets/default-rubber-avatar.jpg'" [alt]="rubber.name" />
        </div>

        <div class="card-info">
            <h3 class="rubber-brand">{{ rubber.brand }}</h3>
            <h3 class="rubber-name">{{ rubber.name }}</h3>
        </div>
    </div>
</div>

<ng-template #noRubbers>
    <p class="no-rubbers">Aucun revêtement enregistré pour le moment.</p>
</ng-template>
</div>
