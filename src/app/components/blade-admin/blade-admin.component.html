<div class="admin-container simple-admin-page">
    <div class="error-message" *ngIf="error">
        {{ error }}
    </div>

    <form class="add-card" (ngSubmit)="addBlade()">
        <div class="avatar-upload-top">
            <label class="avatar-picker" title="Choisir une photo">
                <img [src]="imageBladePreviewUrl || 'assets/default-blade-avatar.png'" alt="Aperçu avatar" />
                <div class="avatar-overlay">📷</div>
                <input #fileInput type="file" accept="image/*" (change)="onFileSelected($event)" hidden />
            </label>
            <span class="avatar-hint">Cliquez pour ajouter une photo</span>
        </div>

        <div class="card-inputs">
            <div class="input-group">
                <label>Marque</label>
                <!-- Correction : name="brand" -->
                <input type="text" name="brand" placeholder="ex: Butterfly" [(ngModel)]="createBladeCommand.brand" required />
            </div>

            <div class="input-group">
                <label>Nom</label>
                <!-- Correction : name="name" -->
                <input type="text" name="name" placeholder="ex: Franziska ZLC" [(ngModel)]="createBladeCommand.name" required />
            </div>
        </div>

        <div class="input-group information-group">
            <label for="blade-information">Informations</label>
            <textarea
                    id="blade-information"
                    name="information"
                    rows="3"
                    placeholder="Décrivez les caractéristiques techniques de ce bois..."
                    [(ngModel)]="createBladeCommand.information"
                    (input)="autoResize($event)"
            ></textarea>
        </div>

        <button type="submit" class="btn-spotify" [disabled]="isSubmitting">
            {{ isSubmitting ? 'Enregistrement...' : 'Ajouter le bois' }}
        </button>
    </form>
</div>
