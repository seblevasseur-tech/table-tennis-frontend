<div class="catalog-list-page">
<div class="error-message" *ngIf="error">
    {{ error }}
</div>

<div class="catalog-search">
    <label for="blade-search">Rechercher un bois</label>
    <div class="catalog-search-control">
        <span class="catalog-search-icon" aria-hidden="true">&#128269;</span>
        <input id="blade-search" type="search" [(ngModel)]="searchTerm" placeholder="Nom ou marque..." />
        <button type="button" class="catalog-search-clear" *ngIf="searchTerm" (click)="searchTerm = ''" aria-label="Effacer la recherche">x</button>
    </div>
</div>

<div class="blades-grid" *ngIf="filteredBlades.length > 0; else noBlades">
    <a class="blade-card" *ngFor="let blade of filteredBlades" [routerLink]="['/blades', blade.id]" [attr.aria-label]="'Voir le détail de ' + blade.brand + ' ' + blade.name">
        <div class="card-avatar">
            <img [src]="blade.avatar || 'assets/default-blade-avatar.png'" [alt]="blade.name" />
        </div>

        <div class="card-info">
            <h3 class="blade-brand">{{ blade.brand }}</h3>
            <h3 class="blade-name">{{ blade.name }}</h3>
        </div>
    </a>
</div>

<ng-template #noBlades>
    <p class="no-blades">{{ searchTerm ? "Aucun bois ne correspond a cette recherche." : "Aucun bois enregistre pour le moment." }}</p>
</ng-template>
</div>
