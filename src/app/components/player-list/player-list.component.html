<div class="player-container">
    <div class="error-message" *ngIf="error">
        {{ error }}
    </div>

    <!-- Formulaire d'ajout -->
    <form class="add-player-form" (ngSubmit)="addPlayer()">
        <h2>Ajouter un joueur</h2>

        <div class="form-row">
            <input
                    type="text"
                    name="name"
                    placeholder="Nom"
                    [(ngModel)]="createPlayerCommand.name"
                    required
            />
            <input
                    type="text"
                    name="forname"
                    placeholder="Prénom"
                    [(ngModel)]="createPlayerCommand.forname"
                    required
            />
            <input
                    type="number"
                    name="rating"
                    placeholder="Rang WTT"
                    [(ngModel)]="createPlayerCommand.rating"
                    required
            />
        </div>

        <div class="file-upload-section">
            <label class="file-btn">
                📷 Choisir un avatar
                <input
                        type="file"
                        accept="image/*"
                        (change)="onFileSelected($event)"
                        hidden
                />
            </label>

            <!-- Zone de Prévisualisation -->
            <div class="avatar-preview" *ngIf="imagePreviewUrl">
                <img [src]="imagePreviewUrl" alt="Aperçu de l'avatar" />
            </div>
        </div>

        <button type="submit" class="btn-primary">Ajouter au classement</button>
    </form>

    <!-- Grille de Cartes des Joueurs -->
    <div class="players-grid" *ngIf="players.length > 0; else noPlayers">
        <div class="player-card" *ngFor="let player of players">

            <div class="card-avatar">
                <img
                        [src]="player.avatar || 'assets/default-avatar.jpg'"
                        [alt]="player.name"
                />
            </div>

            <div class="card-info">
                <h3 class="player-name">{{ player.forname }} {{ player.name }}</h3>
                <span class="rating-badge">🏆 WTT #{{ player.rating }}</span>
            </div>

        </div>
    </div>

    <ng-template #noPlayers>
        <p class="no-players">Aucun joueur enregistré pour le moment.</p>
    </ng-template>
</div>
