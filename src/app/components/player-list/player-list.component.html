<div class="player-list">
  <div class="error-message" *ngIf="error">
    {{ error }}
  </div>
    <!-- Formulaire d'ajout -->
    <form class="add-player-form" (ngSubmit)="addPlayer()">
        <input
                type="text"
                name="name"
                placeholder="Nom"
                [(ngModel)]="createPlayerCommand.name"
                required
        />
        <input
                type="text"
                name="forname"
                placeholder="Prénom"
                [(ngModel)]="createPlayerCommand.forname"
                required
        />
        <input
                type="number"
                name="rating"
                placeholder="Classement WTT"
                [(ngModel)]="createPlayerCommand.rating"
                required
        />
        <input
                type="file"
                accept="image/*"
                (change)="onFileSelected($event)"
        />
        <button type="submit" class="btn-primary">Ajouter</button>
    </form>

    <!-- Tableau des joueurs -->
    <table class="players-table" *ngIf="players.length > 0; else noPlayers">
        <thead>
        <tr>
            <th>Nom</th>
            <th>Prénom</th>
            <th>Classement WTT</th>
            <th>Avatar</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr *ngFor="let player of players">
            <!-- MODE LECTURE -->
            <ng-template #viewMode>
                <td>{{ player.name }}</td>
                <td>{{ player.forname }}</td>
                <td>{{ player.rating }}</td>
                <td>
                    <img
                            [src]="player.avatar || 'assets/default-avatar.jpg'"
                            alt="Avatar"
                            class="avatar-thumb"
                            width="40"
                            height="40"
                    />
                </td>
            </ng-template>
      </tr>
    </tbody>
  </table>

  <ng-template #noPlayers>
    <p class="no-players">No players yet</p>
  </ng-template>
</div>
