<div class="error-message" *ngIf="error">
    {{ error }}
</div>

<div class="players-grid" *ngIf="players.length > 0; else noPlayers">
    <div class="player-card" *ngFor="let player of players">
        <div class="card-avatar">
            <img [src]="player.avatar || 'assets/default-player-avatar.jpg'" [alt]="player.name" />
            <button class="play-btn" title="Voir la fiche">▶</button>
        </div>

        <div class="card-info">
            <h3 class="player-name">{{ player.forname }} {{ player.name }}</h3>
        </div>
    </div>
</div>

<ng-template #noPlayers>
    <p class="no-players">Aucun joueur enregistré pour le moment.</p>
</ng-template>
