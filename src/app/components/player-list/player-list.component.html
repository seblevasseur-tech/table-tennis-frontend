<div class="catalog-list-page">
<div class="error-message" *ngIf="error">
    {{ error }}
</div>

<div class="catalog-search">
    <label for="player-search">Rechercher un joueur</label>
    <div class="catalog-search-control">
        <span class="catalog-search-icon" aria-hidden="true">&#128269;</span>
        <input id="player-search" type="search" [(ngModel)]="searchTerm" placeholder="Nom, prenom ou pays..." />
        <button type="button" class="catalog-search-clear" *ngIf="searchTerm" (click)="searchTerm = ''" aria-label="Effacer la recherche">x</button>
    </div>
</div>

<div class="players-grid" *ngIf="filteredPlayers.length > 0; else noPlayers">
    <a class="player-card" *ngFor="let player of filteredPlayers" [routerLink]="['/players', player.id]" [attr.aria-label]="'Voir le détail de ' + player.forname + ' ' + player.name">
        <div class="card-avatar">
            <img [src]="player.avatar || 'assets/default-player-avatar.jpg'" [alt]="player.name" />
        </div>

        <div class="card-info">
            <h3 class="player-name">{{ player.forname }} {{ player.name }}</h3>
        </div>
    </a>
</div>

<ng-template #noPlayers>
    <p class="no-players">{{ searchTerm ? "Aucun joueur ne correspond a cette recherche." : "Aucun joueur enregistre pour le moment." }}</p>
</ng-template>
</div>
