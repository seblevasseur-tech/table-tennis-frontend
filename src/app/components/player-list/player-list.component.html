<div class="catalog-list-page">
<div class="error-message" *ngIf="error">
    {{ error }}
</div>

<div class="catalog-search-grid">
    <div class="catalog-search">
        <label for="player-name-search">Nom ou prenom</label>
        <div class="catalog-search-control">
            <span class="catalog-search-icon" aria-hidden="true">&#128269;</span>
            <input id="player-name-search" type="text" [(ngModel)]="nameSearchTerm" placeholder="Rechercher un joueur..." />
        </div>
    </div>
    <div class="catalog-search">
        <label for="player-country-filter">Pays</label>
        <div class="catalog-country-dropdown">
            <button
                type="button"
                class="catalog-country-trigger"
                [class.is-open]="isCountryDropdownOpen"
                (click)="toggleCountryDropdown()"
            >
                <ng-container *ngIf="selectedCountry as country; else allCountries">
                    <img class="country-flag" [src]="getCountryFlagUrl(country.code)" [alt]="country.name" />
                    <span>{{ country.name }}</span>
                </ng-container>
                <ng-template #allCountries>
                    <span>Tous les pays</span>
                </ng-template>
                <span class="dropdown-chevron">&#9660;</span>
            </button>
            <div class="catalog-country-menu" *ngIf="isCountryDropdownOpen">
                <button type="button" class="catalog-country-option" [class.selected]="!countryFilter" (click)="selectCountry('')">
                    <span>Tous les pays</span>
                </button>
                <button
                    type="button"
                    class="catalog-country-option"
                    *ngFor="let country of countries"
                    [class.selected]="country.code === countryFilter"
                    (click)="selectCountry(country.code)"
                >
                    <img class="country-flag" [src]="getCountryFlagUrl(country.code)" [alt]="country.name" />
                    <span>{{ country.name }}</span>
                </button>
            </div>
        </div>
    </div>
</div>

<div class="players-grid" *ngIf="filteredPlayers.length > 0; else noPlayers">
    <a class="player-card" *ngFor="let player of filteredPlayers" [routerLink]="['/players', player.id]" [attr.aria-label]="'Voir le détail de ' + player.forname + ' ' + player.name">
        <div class="card-avatar">
            <img [src]="player.avatar || 'assets/default-player-avatar.jpg'" [alt]="player.name" />
        </div>

        <div class="card-info">
            <h3 class="player-name">{{ player.forname }} {{ player.name }}</h3>
        </div>
    </a>
</div>

<ng-template #noPlayers>
    <p class="no-players">{{ (nameSearchTerm || countryFilter) ? "Aucun joueur ne correspond a ces filtres." : "Aucun joueur enregistre pour le moment." }}</p>
</ng-template>
</div>
