<div class="player-container">
    <div class="error-message" *ngIf="error">
        {{ error }}
    </div>

    <!-- Formulaire d'ajout sous forme de Carte -->
    <form class="add-player-card" (ngSubmit)="addPlayer()">
        <h2 class="card-title">Nouveau Joueur</h2>

        <!-- Avatar interactif en haut de la carte -->
        <div class="avatar-upload-top">
            <label class="avatar-picker" title="Cliquez pour choisir une photo">
                <img
                        [src]="imagePreviewUrl || 'assets/default-avatar.jpg'"
                        alt="Aperçu avatar"
                />
                <div class="avatar-overlay">
                    <span>📷</span>
                </div>
                <input
                        type="file"
                        accept="image/*"
                        (change)="onFileSelected($event)"
                        hidden
                />
            </label>
            <span class="avatar-hint">Ajouter une photo</span>
        </div>

        <!-- Champs de saisie verticaux -->
        <div class="card-inputs">
            <input
                    type="text"
                    name="name"
                    placeholder="Nom"
                    [(ngModel)]="createPlayerCommand.name"
                    required
            />
            <input
                    type="text"
                    name="forname"
                    placeholder="Prénom"
                    [(ngModel)]="createPlayerCommand.forname"
                    required
            />
            <input
                    type="number"
                    name="rating"
                    placeholder="Rang WTT"
                    [(ngModel)]="createPlayerCommand.rating"
                    required
            />
        </div>

        <button type="submit" class="btn-primary">Ajouter le joueur</button>
    </form>

    <hr class="divider" />

    <!-- Grille de Cartes des Joueurs -->
    <div class="players-grid" *ngIf="players.length > 0; else noPlayers">
        <div class="player-card" *ngFor="let player of players">
            <div class="card-avatar">
                <img
                        [src]="player.avatar || 'assets/default-avatar.jpg'"
                        [alt]="player.name"
                />
            </div>

            <div class="card-info">
                <h3 class="player-name">{{ player.forname }} {{ player.name }}</h3>
                <span class="rating-badge">🏆 WTT #{{ player.rating }}</span>
            </div>
        </div>
    </div>

    <ng-template #noPlayers>
        <p class="no-players">Aucun joueur enregistré pour le moment.</p>
    </ng-template>
</div>
