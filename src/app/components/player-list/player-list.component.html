<div class="catalog-list-page">
<div class="error-message" *ngIf="error">
    {{ error }}
</div>

<div class="catalog-search-grid">
    <div class="catalog-search">
        <label for="player-name-search">Nom ou prenom</label>
        <div class="catalog-search-control">
            <span class="catalog-search-icon" aria-hidden="true">&#128269;</span>
            <input id="player-name-search" type="search" [(ngModel)]="nameSearchTerm" placeholder="Rechercher un joueur..." />
            <button type="button" class="catalog-search-clear" *ngIf="nameSearchTerm" (click)="nameSearchTerm = ''" aria-label="Effacer la recherche">x</button>
        </div>
    </div>
    <div class="catalog-search">
        <label for="player-country-filter">Pays</label>
        <select id="player-country-filter" class="catalog-filter-select" [(ngModel)]="countryFilter">
            <option value="">Tous les pays</option>
            <option *ngFor="let country of countries" [value]="country.code">{{ country.name }}</option>
        </select>
    </div>
</div>

<div class="players-grid" *ngIf="filteredPlayers.length > 0; else noPlayers">
    <a class="player-card" *ngFor="let player of filteredPlayers" [routerLink]="['/players', player.id]" [attr.aria-label]="'Voir le détail de ' + player.forname + ' ' + player.name">
        <div class="card-avatar">
            <img [src]="player.avatar || 'assets/default-player-avatar.jpg'" [alt]="player.name" />
        </div>

        <div class="card-info">
            <h3 class="player-name">{{ player.forname }} {{ player.name }}</h3>
        </div>
    </a>
</div>

<ng-template #noPlayers>
    <p class="no-players">{{ (nameSearchTerm || countryFilter) ? "Aucun joueur ne correspond a ces filtres." : "Aucun joueur enregistre pour le moment." }}</p>
</ng-template>
</div>
